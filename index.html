<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シャクレゲーム</title>
<style>
:root{--bg:#fff;--fg:#111;--ac:#00b37a;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;font-size:18px;font-weight:700;pointer-events:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.88);text-align:center;gap:10px;padding:24px}
#ov.h{color:#111;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)),var(--hb) center 40%/auto 90% no-repeat,#fff}
#ov.h h1,#ov.h p{text-shadow:0 0 8px #fff,0 0 4px #fff;opacity:1}
#ov h1{margin:0;font-size:28px}#ov p{margin:0;opacity:.8;line-height:1.5}
#ov input{padding:10px;font-size:16px;border-radius:8px;border:1px solid #888;background:#fff;color:var(--fg);text-align:center;min-width:200px}
.nr{display:flex;gap:8px;align-items:center}
#ov .nr button{margin-top:0;min-width:0;padding:10px 16px;font-size:15px}
#ov .nr input{min-width:0;width:170px}
#ov button{margin-top:10px;min-width:220px;padding:12px 32px;font-size:18px;font-weight:700;border:0;border-radius:99px;background:var(--ac);color:#0d0d14}
.zn{position:fixed;top:0;bottom:0;width:50%;display:flex;align-items:center;padding:0 14px;box-sizing:border-box;pointer-events:none;opacity:.3;font-size:44px;line-height:1.2;transition:opacity .1s,background .1s}.zn small{display:block;font-size:13px}#zl{left:0}#zr{right:0;justify-content:flex-end;text-align:right}.zn.on{opacity:.8;background:rgba(0,179,122,.1)}
#joy{position:fixed;left:calc(50% - 65px);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.06);border:2px solid rgba(0,0,0,.25)}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(0,179,122,.75)}
</style></head><body>

let idt=null,idExp=0,uid=null;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
function nkey(n){return Array.from(n.normalize('NFKC').trim().toLowerCase()).map(c=>c.codePointAt(0).toString(16)).join('_')}
async function token(){if(idt&&Date.now()<idExp)return idt;const K=firebaseConfig.apiKey,rt=ls('rt');
if(rt){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+K,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});if(r.ok){const d=await r.json();idt=d.id_token;uid=d.user_id;ls('rt',d.refresh_token);idExp=Date.now()+(d.expires_in-120)*1000;return idt}}
const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+K,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'});if(!r.ok)throw new Error('auth');const d=await r.json();idt=d.idToken;uid=d.localId;ls('rt',d.refreshToken);idExp=Date.now()+(d.expiresIn-120)*1000;return idt}
async function claimName(name){const key=nkey(name),tk=await token();const g=await fetch(DB+'/names/'+key+'.json');if(!g.ok)throw 0;const cur=await g.json();if(cur)return cur.uid===uid?'ok':'taken';
const p=await fetch(DB+'/names/'+key+'.json?auth='+tk,{method:'PUT',body:JSON.stringify({uid:uid,name:name})});return p.ok?'ok':'taken'}
async function releaseName(old){const tk=await token(),k=nkey(old);await fetch(DB+'/ranking/'+k+'.json?auth='+tk,{method:'DELETE'});await fetch(DB+'/names/'+k+'.json?auth='+tk,{method:'DELETE'})}
async function submitBest(){const name=getName(),sc=parseFloat(ls('bs')||'0');if(!name||!(sc>0))return 'none';const tk=await token();const r=await fetch(DB+'/ranking/'+nkey(name)+'.json?auth='+tk,{method:'PUT',body:JSON.stringify({name:name,score:sc,ts:{'.sv':'timestamp'}})});return r.ok?'ok':'ng'}

let ac,mg,nb,muted=false,bgmT=null,nextT=0,stp=0,lastSp=0;
function initAudio(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();mg=ac.createGain();mg.gain.value=muted?0:.7;mg.connect(ac.destination);nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(ac.state==='suspended')ac.resume()}
function tone(f,d,ty,v,s,f2){if(!ac)return;s=s||ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(mg);o.start(s);o.stop(s+d)}
function nz(d,v,s,hp){if(!ac)return;s=s||ac.currentTime;const o=ac.createBufferSource(),g=ac.createGain(),fl=ac.createBiquadFilter();o.buffer=nb;fl.type='highpass';fl.frequency.value=hp||500;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(fl);fl.connect(g);g.connect(mg);o.start(s);o.stop(s+d)}

const SP=60/150/4,BASS=[55,0,55,0,65.4,0,55,0,49,0,49,0,58.3,0,61.7,0],LEAD=[440,0,523,0,659,0,523,0,440,0,392,0,523,0,659,0];
function chant(t){setTimeout(()=>{const ss=window.speechSynthesis;if(muted||!ss||ss.speaking||ss.pending)return;const u=new SpeechSynthesisUtterance('シャクレ');u.lang='ja-JP';const v=ss.getVoices().find(x=>x.lang&&x.lang.replace('_','-').startsWith('ja'));if(v)u.voice=v;u.rate=1.5;u.pitch=1.5;u.volume=1;ss.speak(u)},Math.max(0,(t-ac.currentTime)*1000))}
function sched(){while(nextT<ac.currentTime+.15){const i=stp%16;
if(i%4===0)tone(120,.15,'sine',.4,nextT,40);
if(i%4===2)nz(.05,.1,nextT,6000);
if(i===4||i===12)nz(.12,.22,nextT,1500);
if(BASS[i])tone(BASS[i]*2,SP*1.6,'sawtooth',.1,nextT);
if(LEAD[i])tone(LEAD[i],SP*1.2,'square',.04,nextT);
if(i%8===0)chant(nextT);
nextT+=SP;stp++}}
function bgmStart(){if(!ac||bgmT)return;nextT=ac.currentTime+.1;stp=0;bgmT=setInterval(sched,40)}

m" maxlength="12" placeholder="ユーザーネーム" value="'+esc(getName())+'"><button id="sn">決定</button></div><button id="go">サバイバル</button><button id="rk">ランキング</button><p id="msg" style="min-height:1.5em">'+(getName()?'ユーザーネーム：'+esc(getName()):'名前を設定するとランキングに自動登録されます')+'</p>';ov.style.display='flex';document.getElementById('go').onclick=start;document.getElementById('rk').onclick=showRank;document.getElementById('sn').onclick=setName}home();
function norm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a}
function loop(now){
  if(!run)return;
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  // player: move only along the circle
  const maxW=5.5;
  let mag=Math.hypot(stick.x,stick.y);
  if(mag>.3){const d=norm(Math.atan2(stick.y,stick.x)-pa);pa+=Math.max(-maxW*dt,Math.min(maxW*dt,d))}
  const kx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+td;
  if(kx)pa+=kx*maxW*dt*.8;
  pa=norm(pa);
  // spawn
  spawn-=dt;
  if(spawn<=0){sfx.spawn();spawn=Math.max(.08,1-t*.04);const n=1+Math.floor(t/12)+(Math.random()<Math.min(.6,t/60)?1:0);for(let k=0;k<n;k++){
    const a=Math.random()<.35?pa+(Math.random()-.5)*.5:Math.random()*Math.PI*2;
    heads.push({a,d:0,sp:(.6+Math.min(t*.03,2))*R*(.8+Math.random()*.4)})}}
  const px=cx+Math.cos(pa)*R,py=cy+Math.sin(pa)*R;
  const HH=R*.62,HW=HH*img.width/img.height;
  ctx.clearRect(0,0,W,H);
  // ring
  ctx.strokeStyle='rgba(0,179,122,.45)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.arc(cx,cy,10,0,7);ctx.fill();
  const far=Math.hypot(W,H);
  for(let i=heads.length-1;i>=0;i--){const o=heads[i];o.d+=o.sp*dt;
    const s=Math.min(1.4,.15+.85*o.d/R),w=HW*s,h=HH*s;
    const dx=Math.cos(o.a),dy=Math.sin(o.a);
    const x=cx+dx*o.d,y=cy+dy*o.d;
    ctx.save();ctx.translate(x,y);ctx.rotate(o.a-Math.PI/2);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();
    // collision: chin tip + center
    const bx=x-dx*h*.08,by=y-dy*h*.08;
    const hit=Math.hypot(bx-px,by-py)<w*.3+9;
    if(hit&&o.d>R*.35){return over()}
    if(!o.pz&&o.d>R*1.3){o.pz=1;sfx.pass()}if(o.d>far)heads.splice(i,1)}
  // player triangle (points outward)
  
  ctx.fillStyle='#00b37a';ctx.beginPath();ctx.arc(px,py,13,0,7);ctx.fill();
  sc.textContent=t.toFixed(1)+'秒';
  requestAnimationFrame(loop)}
function over(){run=false;ov.className='';lastScore=Math.round(t*10)/10;bgmStop();sfx.over();best=Math.max(best,t);bs.textContent='BEST '+best.toFixed(1);
  ov.innerHTML='<h1>ゲームオーバー</h1><p>記録：'+t.toFixed(1)+'秒</p><button id="go">もう一度</button><button id="hm">ホームへ</button><p id="msg" style="min-height:1.5em"></p>';
  ov.style.display='flex';document.getElementById('go').onclick=start;autoSubmit();document.getElementById('hm').onclick=home}
