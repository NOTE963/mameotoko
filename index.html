<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>豆男 - VHS DODGE</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="豆男">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  /* iOS Safari auto-zooms into any input/textarea/select with font-size below 16px on focus,
     regardless of the viewport meta tag - keep all of them at >=16px to prevent that. */
  input, textarea, select { font-size:16px; touch-action:manipulation; }
  html,body { width:100%; height:100%; background:#1a1a1a; overflow:hidden; font-family:'Courier New', monospace; }

  #stage {
    position:relative; width:100%; height:100%;
    max-width:520px; max-height:920px; margin:0 auto;
    background:#111; overflow:hidden;
    filter:contrast(1.0) saturate(1.05) brightness(1.3);
  }
  #bg {
    position:absolute; inset:0;
    background-size:cover; background-position:27% 50%;
    filter:brightness(1.5) contrast(1.0);
  }
  #noise {
    position:absolute; inset:0; pointer-events:none; opacity:0.06; z-index:27;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:noiseshift 0.2s steps(2) infinite;
  }
  @keyframes noiseshift { 0%{transform:translate(0,0)} 50%{transform:translate(-2%,1%)} 100%{transform:translate(1%,-2%)} }

  #score {
    position:absolute; bottom:16px; left:0; right:0; text-align:center;
    color:#e8e8e8; font-size:13px; letter-spacing:2px;
    text-shadow:0 0 4px rgba(0,0,0,0.9); z-index:40; pointer-events:none;
  }

  #lanes { position:absolute; inset:0; z-index:10; }
  .giant-obj {
    position:absolute; top:50%; left:112%; width:92px;
    transform:translate(-50%,-50%);
    pointer-events:none; z-index:15;
    filter:drop-shadow(0 0 5px rgba(255,255,255,0.28)) brightness(1.05);
    will-change:left,top;
  }
  .giant-obj img {
    width:100%; display:block; transform-origin:50% 90%;
    animation:runBob 0.28s ease-in-out infinite alternate;
  }
  @keyframes runBob {
    from { transform:translateY(-3px) rotate(-2.5deg); }
    to   { transform:translateY(3px)  rotate(2.5deg); }
  }
  #player {
    position:absolute; left:14%; top:50%; width:46px; height:22px;
    transform:translate(-50%,-50%);
    z-index:20; pointer-events:none;
    transition:top 0.16s cubic-bezier(.3,.9,.3,1);
  }
  #player .shadow {
    width:100%; height:100%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 75%);
  }
  #player .mark {
    position:absolute; left:50%; top:-6px; transform:translateX(-50%);
    width:10px; height:10px; border-radius:50%;
    background:#ffd23b; box-shadow:0 0 10px #ffd23b;
    opacity:0.95;
  }

  #laneGuides { position:absolute; inset:0; z-index:9; pointer-events:none; opacity:0.16; }
  .laneLine { position:absolute; top:0; bottom:0; width:1px; background:#fff; }
  .laneLineH { position:absolute; left:0; right:0; height:1px; background:#fff; }

  #tapzone { position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; }
  .tapHalf { flex:1; }

  #startScreen, #overScreen, #rankScreen {
    position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, rgba(70,45,45,0.85), rgba(35,30,30,0.88) 75%); color:#eee;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; z-index:80; gap:14px;
  }
  #overScreen, #rankScreen { display:none; }
  #rankScreen { z-index:85; overflow-y:auto; padding:40px 22px 26px; justify-content:flex-start; }
  #rankScreen, #rankScreen * { touch-action:pan-y; }
  .title {
    font-size:26px; font-weight:800; letter-spacing:3px; color:#fff;
    text-shadow:0 0 2px rgba(255,255,255,0.4), 0 0 18px rgba(255,42,42,0.85), 0 0 36px rgba(255,42,42,0.4);
  }
  .sub { font-size:13px; line-height:1.8; color:#c9c9c9; max-width:340px; }
  .btn {
    padding:13px 30px; color:#fff;
    background:linear-gradient(160deg, #ff4545, #d40f0f);
    font-weight:700; letter-spacing:2px; border:none; border-radius:999px;
    font-family:inherit; font-size:14px;
    box-shadow:0 4px 0 #8f0a0a, 0 6px 18px rgba(255,20,20,0.45);
    pointer-events:auto; cursor:pointer;
    transition:transform 0.08s ease, box-shadow 0.08s ease;
  }
  .btn:active {
    transform:translateY(3px);
    box-shadow:0 1px 0 #8f0a0a, 0 2px 8px rgba(255,20,20,0.35);
  }
  .btn.secondary {
    background:rgba(255,255,255,0.06); color:#eee;
    border:1px solid rgba(255,255,255,0.28);
    box-shadow:0 3px 0 rgba(255,255,255,0.06), 0 4px 14px rgba(0,0,0,0.35);
    backdrop-filter:blur(2px);
  }
  .btn.secondary:active { box-shadow:0 1px 0 rgba(255,255,255,0.06); }
  .btn.small { padding:10px 20px; font-size:12px; }
  .btnRow { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  #scoreLine { font-size:15px; color:#fff; margin-top:6px; }
  #bestLine { font-size:12px; color:#999; }

  #muteBtn {
    position:absolute; top:12px; right:14px; z-index:60;
    background:rgba(20,20,20,0.55); border:1px solid rgba(255,255,255,0.3);
    color:#eee; font-size:13px; width:32px; height:32px; border-radius:50%;
    line-height:1; cursor:pointer; pointer-events:auto;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  #reloadBtn {
    position:absolute; top:12px; right:50px; z-index:60;
    background:rgba(20,20,20,0.55); border:1px solid rgba(255,255,255,0.3);
    color:#eee; font-size:13px; width:32px; height:32px; border-radius:50%;
    line-height:1; cursor:pointer; pointer-events:auto;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }

  #rankScreen .title { font-size:20px; }
  .weekLabel { font-size:11px; color:#999; letter-spacing:1px; }
  #nameRow { display:flex; gap:8px; align-items:center; margin-top:6px; }
  #usernameInput {
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.3);
    color:#fff; font-family:inherit; font-size:16px; padding:10px 12px;
    border-radius:10px; width:150px; letter-spacing:1px;
  }
  #rankList {
    width:100%; max-width:340px; margin-top:8px;
    list-style:none; text-align:left;
    display:flex; flex-direction:column; gap:5px;
  }
  #rankList li {
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; padding:9px 12px;
    background:linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px; letter-spacing:0.5px;
  }
  #rankList li .rk { color:#ff6a4d; width:24px; flex-shrink:0; font-weight:700; }
  #rankList li .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 6px; }
  #rankList li .tm { color:#ffd23b; font-weight:600; }
  #rankStatus { font-size:12px; color:#888; min-height:16px; }

</style>
</head>
<body>

<div id="stage">
  <div id="bg"></div>
  <div id="laneGuides"></div>
  <div id="lanes"></div>
  <div id="player"><div class="shadow"></div><div class="mark"></div></div>

  <div id="noise"></div>

  <button id="muteBtn">🔊</button>
  <button id="reloadBtn" title="リロード">🔄</button>
  <div id="score">生存タイム: <span id="scoreVal">0.0</span>秒</div>

  <div id="tapzone">
    <div class="tapHalf" id="tapZoneUp"></div>
    <div class="tapHalf" id="tapZoneDown"></div>
  </div>

  <div id="startScreen">
    <div class="title">豆男</div>
    <div class="btnRow">
      <button class="btn" id="startBtn">生き残る</button>
    </div>
    <div class="btnRow">
      <button class="btn secondary" id="rankBtn">ランキング</button>
    </div>
    <button class="btn secondary small" id="installBtn" style="display:none;">📲 アプリとしてインストール</button>
    <div class="weekLabel" id="iosHint" style="display:none;max-width:300px;">
      iPhoneの場合: 共有ボタン →「ホーム画面に追加」でインストールできます
    </div>
  </div>

  <div id="overScreen">
    <div class="title" id="overTitle">ゲームオーバー</div>
    <div class="sub">また挑戦しよう！</div>
    <div id="scoreLine">生存時間: <span id="finalDist">0.0</span>秒</div>
    <div id="bestLine">自己ベスト: <span id="bestDist">0.0</span>秒</div>
    <div class="btnRow">
      <button class="btn" id="retryBtn">もう一度 / RETRY</button>
      <button class="btn secondary" id="overRankBtn">ランキング</button>
      <button class="btn secondary" id="overHomeBtn">ホームへ</button>
    </div>
  </div>

  <div id="rankScreen">
    <div class="title">ランキング</div>
    <div class="weekLabel" id="weekLabel">ランキング</div>
    <div id="nameRow">
      <input id="usernameInput" type="text" maxlength="10" placeholder="ユーザーネーム">
      <button class="btn small" id="saveNameBtn">保存</button>
    </div>
    <div id="rankStatus">読み込み中...</div>
    <ol id="rankList"></ol>
    <button class="btn secondary" id="rankBackBtn">ホームへ戻る</button>
  </div>

</div>

  // ---------- synthesized ambient BGM (light, upbeat pad) ----------
  const muteBtn = document.getElementById('muteBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  let audioCtx=null, master=null, droneGain=null, muted=false;

  function ensureAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = muted?0:0.6;
    master.connect(audioCtx.destination);

    droneGain = audioCtx.createGain();
    droneGain.gain.value = 0.0001;
    droneGain.connect(master);

    const lp = audioCtx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=1800;
    lp.connect(droneGain);

    // Gentle major triad pad (C4, E4, G4) instead of a dissonant low drone.
    [261.63, 329.63, 392.0].forEach(f=>{
      const o = audioCtx.createOscillator();
      o.type='triangle'; o.frequency.value=f;
      const g = audioCtx.createGain(); g.gain.value=0.3;
      o.connect(g); g.connect(lp);
      o.start();
    });

    const lfo = audioCtx.createOscillator();
    lfo.type='sine'; lfo.frequency.value=0.1;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value=300;
    lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
    lfo.start();
  }

  function noiseBurst(dur, type, startFreq, endFreq, vol){
    if(!audioCtx || muted) return;
    const bufSize = Math.floor(audioCtx.sampleRate*dur);
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = type||'bandpass';
    bp.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
    if(endFreq) bp.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime+dur);
    bp.Q.value = 1.1;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(); src.stop(audioCtx.currentTime+dur);
  }

  function whoosh(){ noiseBurst(0.35, 'bandpass', 300, 900, 0.18); }

  function stinger(){
    if(!audioCtx || muted) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    o.type='sine'; o.frequency.setValueAtTime(320,t); o.frequency.exponentialRampToValueAtTime(180,t+0.3);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+0.35);
  }

  function fadeDrone(target, time){
    if(!droneGain||!audioCtx) return;
    droneGain.gain.cancelScheduledValues(audioCtx.currentTime);
    droneGain.gain.setValueAtTime(Math.max(droneGain.gain.value,0.0001), audioCtx.currentTime);
    droneGain.gain.exponentialRampToValueAtTime(Math.max(target,0.0001), audioCtx.currentTime+time);
  }

  muteBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if(master) master.gain.value = muted?0:0.75;
  });

  reloadBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    location.reload();
  });
  // -------------------------------------------------------------------

  // ---------- Firebase ranking ----------
  const firebaseConfig = {
    apiKey: "AIzaSyAitmCVB6ILKx2CgxmC7CIKlf16OSch_N4",
    authDomain: "hirai1.firebaseapp.com",
    projectId: "hirai1",
    storageBucket: "hirai1.firebasestorage.app",
    messagingSenderId: "227398539379",
    appId: "1:227398539379:web:44ead14c65d055c5e9b206",
    measurementId: "G-K8CK47S5KB"
  };
  let db = null;
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ console.error('firebase init failed', e); }

  function getUsername(){
    let n='';
    try{ n = localStorage.getItem('hiraikunName')||''; }catch(e){}
    return n;
  }
  function setUsername(n){
    try{ localStorage.setItem('hiraikunName', n); }catch(e){}
  }
  function ensureUsername(){
    let n = getUsername();
    if(!n){
      n = '名無し' + Math.floor(Math.random()*9000+1000);
      setUsername(n);
    }
    return n;
  }
  ensureUsername();
  usernameInput.value = getUsername();

  saveNameBtn.addEventListener('click', ()=>{
    const v = usernameInput.value.trim().slice(0,10);
    if(!v) return;
    setUsername(v);
    rankStatus.textContent = 'ユーザーネームを保存しました';
    setTimeout(()=>{ if(rankStatus.textContent==='ユーザーネームを保存しました') rankStatus.textContent=''; }, 1500);
  });

  function formatTime(sec){
    return sec.toFixed(1);
  }

  function getUserId(){
    let id='';
    try{ id = localStorage.getItem('hiraikunUserId')||''; }catch(e){}
    if(!id){
      id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : ('u'+Date.now()+Math.random().toString(16).slice(2));
      try{ localStorage.setItem('hiraikunUserId', id); }catch(e){}
    }
    return id;
  }
  const userId = getUserId();

  function submitScore(timeSec){
    if(!db || timeSec < 1) return;
    const name = ensureUsername();
    const roundedTime = Math.round(timeSec*10)/10;
    const docRef = db.collection('rankings').doc(userId);
    docRef.get().then(doc=>{
      if(doc.exists && Number(doc.data().time) >= roundedTime){
        return; // already have an equal or better all-time record, keep it
      }
      return docRef.set({
        name: name,
        time: roundedTime,
        ts: firebase.firestore.FieldValue.serverTimestamp()
      });
    }).catch(e=>console.error('submitScore failed', e));
  }

  function loadRanking(){
    rankStatus.textContent = '読み込み中...';
    rankList.innerHTML = '';
    if(!db){ rankStatus.textContent = 'ランキングに接続できません'; return; }
    document.getElementById('weekLabel').textContent = 'ランキング';
    db.collection('rankings')
      .limit(200)
      .get()
      .then(snap=>{
        if(snap.empty){
          rankStatus.textContent = 'まだ記録がありません';
          return;
        }
        rankStatus.textContent = '';
        const rows = [];
        snap.forEach(doc=>rows.push(Object.assign({id:doc.id}, doc.data())));
        rows.sort((a,b)=> (Number(b.time)||0) - (Number(a.time)||0));
        // de-dupe by display name: leftover legacy documents (pre weekKey removal)
        // can leave more than one row per real person; keep only their best (first
        // after the desc sort) so each person appears once. Also clean up the
        // losing duplicate documents in the background so only the best remains.
        const seenNames = new Set();
        const deduped = [];
        const staleDupeIds = [];
        rows.forEach(r=>{
          const key = r.name || '???';
          if(seenNames.has(key)){ staleDupeIds.push(r.id); return; }
          seenNames.add(key);
          deduped.push(r);
        });
        if(staleDupeIds.length){
          staleDupeIds.forEach(id=>{
            db.collection('rankings').doc(id).delete().catch(()=>{});
          });
        }
        const top = deduped.slice(0,30);
        top.forEach((d,idx)=>{
          const li = document.createElement('li');
          li.innerHTML = '<span class="rk">'+(idx+1)+'</span><span class="nm">'+escapeHtml(d.name||'???')+'</span><span class="tm">'+Number(d.time).toFixed(1)+'秒</span>';
          rankList.appendChild(li);
        });
      })
      .catch(e=>{
        console.error(e);
        rankStatus.textContent = '読み込みに失敗しました: ' + (e && (e.code || e.message) || '不明なエラー');
      });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------------------------------------------------------------------

  function openRanking(){
    rankScreen.style.display = 'flex';
    loadRanking();
  }
  function closeRanking(){
    rankScreen.style.display = 'none';
  }

  rankBtn.addEventListener('click', openRanking);
  overRankBtn.addEventListener('click', openRanking);
  rankBackBtn.addEventListener('click', ()=>{
    closeRanking();
    startScreen.style.display = 'flex';
    overScreen.style.display = 'none';
  });
  overHomeBtn.addEventListener('click', ()=>{
    overScreen.style.display = 'none';
    startScreen.style.display = 'flex';
  });
  // ---------------------------------------

  let laneIdx = 1;
  let running=false, gameOver=false;
  let rng = Math.random;
  let score=0, best=0;
  try{ best = parseFloat(localStorage.getItem('hiraikunBestTime')||'0')||0; }catch(e){best=0;}
  bestDistEl.textContent = formatTime(best);

  let objs = [];
  let spawnTimer=0, spawnInterval=1500, fallDuration=1750, elapsed=0;
  let lastTime=0;

  function setPlayerLane(idx){
    laneIdx = Math.max(0, Math.min(LANES.length-1, idx));
    player.style.top = ROWS[laneIdx]+'%';
  }
  setPlayerLane(1);

  function moveUp(){ if(!running||gameOver) return; setPlayerLane(laneIdx-1); }
  function moveDown(){ if(!running||gameOver) return; setPlayerLane(laneIdx+1); }

  window.addEventListener('keydown', (e)=>{
    if(e.code==='ArrowUp' || e.code==='KeyW'){ e.preventDefault(); moveUp(); }
    if(e.code==='ArrowDown' || e.code==='KeyS'){ e.preventDefault(); moveDown(); }
  });
  document.getElementById('tapZoneUp').addEventListener('pointerdown', moveUp);
  document.getElementById('tapZoneDown').addEventListener('pointerdown', moveDown);

  let touchStartX=null, touchStartY=null;
  stage.addEventListener('touchstart', (e)=>{ touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, {passive:true});
  stage.addEventListener('touchend', (e)=>{
    if(touchStartX===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 28){
      dy>0 ? moveDown() : moveUp();
    }
    touchStartX=null; touchStartY=null;
  }, {passive:true});

  function spawnGiant(){
    const lane = Math.floor(rng()*LANES.length);
    const el = document.createElement('div');
    el.className='giant-obj';
    el.style.top = ROWS[lane]+'%';
    el.style.left = SPAWN_X+'%';

    el.innerHTML = '<img src="' + IMG_SPRITE + '">';

    lanesEl.appendChild(el);
    objs.push({ el, lane, t0: performance.now(), dur: fallDuration, resolved:false });
    whoosh();
  }

  function updateObjs(now){
    for(let i=objs.length-1;i>=0;i--){
      const o = objs[i];
      const p = (now - o.t0) / o.dur; // p==1 -> giant reaches the player's column
      if(p >= 1 && !o.resolved){
        o.resolved = true;
        if(o.lane === laneIdx){
          triggerCatch();
          return;
        }
        score++;
      }
      const x = SPAWN_X + p*(PLAYER_X - SPAWN_X);
      if(x < -16){
        o.el.remove();
        objs.splice(i,1);
        continue;
      }
      o.el.style.left = x.toFixed(2)+'%';
    }
  }

  function loop(now){
    if(!lastTime) lastTime = now;
    const dt = Math.min(0.05, (now-lastTime)/1000);
    lastTime = now;

    if(running && !gameOver){
      elapsed += dt;
      spawnTimer += dt*1000;
      spawnInterval = Math.max(380, 1500 - elapsed*34);
      fallDuration = Math.max(680, 1750 - elapsed*30);
      if(spawnTimer >= spawnInterval){
        spawnTimer = 0;
        spawnGiant();
        if(elapsed > 12 && rng() < 0.35){
          setTimeout(()=>{ if(running && !gameOver) spawnGiant(); }, 180);
        }
      }
      updateObjs(now);
      scoreVal.textContent = formatTime(elapsed);

      if(droneGain && audioCtx){
        droneGain.gain.setTargetAtTime(0.14, audioCtx.currentTime, 0.8);
      }
    }
    requestAnimationFrame(loop);
  }

  function triggerCatch(){
    gameOver = true; running = false;
    stinger();
    fadeDrone(0.0001, 0.5);

    submitScore(elapsed);
    setTimeout(()=>{
      finalDist.textContent = formatTime(elapsed);
      if(elapsed>best){ best=elapsed; try{localStorage.setItem('hiraikunBestTime',String(best));}catch(e){} }
      bestDistEl.textContent = formatTime(best);
      overTitle.textContent = 'ゲームオーバー';
      overScreen.style.display='flex';
    }, 400);
  }

  function startGame(){
    ensureAudio();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    startScreen.style.display='none';
    overScreen.style.display='none';
    closeRanking();
    objs.forEach(o=>o.el.remove());
    objs = [];
    score=0; elapsed=0; spawnTimer=0; gameOver=false;
    spawnInterval=1500; fallDuration=1750;
    scoreVal.textContent='0.0';
    setPlayerLane(1);
    running=true;
    fadeDrone(0.14, 1.2);
  }

  startBtn.addEventListener('click', ()=>startGame());
  retryBtn.addEventListener('click', ()=>startGame());

  function showScreen(el){
    [startScreen, overScreen, rankScreen].forEach(s=>{ if(s) s.style.display='none'; });
    if(el) el.style.display = 'flex';
  }


  requestAnimationFrame(loop);

  // ---------- PWA install ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(e=>console.error('sw register failed', e));
    });
  }

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', async ()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });
  window.addEventListener('appinstalled', ()=>{
    installBtn.style.display = 'none';
  });

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isIOS && !isStandalone){
    iosHint.style.display = 'block';
  }
  // ---------------------------------------

  // ================= gamepad support (Switch / PS / Xbox etc.) =================
  // Lane movement: D-pad up/down or the left stick.
  let gpPrevUp = false, gpPrevDown = false;
  const GP_AXIS_DEADZONE = 0.5;

  function gamepadMoveUp(){
    if(running && !gameOver){ moveUp(); }
  }
  function gamepadMoveDown(){
    if(running && !gameOver){ moveDown(); }
  }

  function pollGamepad(){
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let pad = null;
    for(let i=0;i<pads.length;i++){ if(pads[i]){ pad = pads[i]; break; } }
    if(pad){
      const dpadUp = !!(pad.buttons[12] && pad.buttons[12].pressed);
      const dpadDown = !!(pad.buttons[13] && pad.buttons[13].pressed);
      const axisY = pad.axes[1] || 0;
      const curUp = dpadUp || axisY < -GP_AXIS_DEADZONE;
      const curDown = dpadDown || axisY > GP_AXIS_DEADZONE;

      if(curUp && !gpPrevUp) gamepadMoveUp();
      if(curDown && !gpPrevDown) gamepadMoveDown();

      gpPrevUp = curUp; gpPrevDown = curDown;
    }
    requestAnimationFrame(pollGamepad);
  }
  requestAnimationFrame(pollGamepad);
  // ===============================================================

})();
</script>
